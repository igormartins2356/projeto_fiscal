# Alíquota interna geral (modal) de ICMS por UF. Chave: [uf, ncm]; "*" é a linha geral, usada quando
# não há linha por NCM. Classe C em DATA_SOURCES: dado curado, conferido linha a linha contra a norma.
#
# Reconstrução de 2026-09-10, conferida em fonte primária (lei estadual e RICMS) UF a UF. A versão
# anterior foi perdida do banco de desenvolvimento e não existia no repositório; este arquivo passa a
# ser a fonte reproduzível (rake catalog:icms_internal_rate).
#
# `fcp_rate` é APENAS o adicional de fundo de combate à pobreza que (a) incide de forma geral sobre as
# mercadorias e (b) vai destacado no campo pFCP da NF-e. Adicional por lista de produtos, embutido na
# alíquota (PE, MS, ES) ou recolhido em guia própria fora do pFCP (RS) fica 0.00 — é assim que o motor
# usa o campo, e somar onde não se destaca produz cálculo errado.
#
# `confirm: true` marca a UF que NÃO foi fechada em fonte primária. Essas linhas não entram na versão
# gerada: tabela esparsa não gera apontamento, alíquota errada gera. Para incluí-las, leia a norma,
# corrija a linha e remova a marca.
#
# `effective_from` é a data em que a alíquota atual passou a valer. Documento anterior a ela não acha
# linha e não é avaliado — preferível a ser avaliado contra a alíquota errada (ver RN e AL).

