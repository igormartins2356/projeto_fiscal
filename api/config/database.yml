default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "fiscal") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "fiscal") %>

development:
  <<: *default
  database: fiscal_development

test:
  <<: *default
  database: fiscal_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
